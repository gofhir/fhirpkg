name: ci

on:
  push:
  pull_request:

# check-packages compara con gofhir/searchindex y la paridad usa sus recursos
# generados (plan 004 D3): se clona al lado, como en el árbol local
# (../go-searchindex). El repo es privado, así que necesita el secreto
# SEARCHINDEX_TOKEN (token de solo lectura del contenido de gofhir/searchindex).
env:
  GO_VERSION: "1.26"
  # Fijadas, no «latest»: un linter que se actualiza solo pone en rojo un commit
  # ajeno, y el formato de .golangci.yml depende de la versión. Mantener
  # GOLANGCI_VERSION y GOVULNCHECK_VERSION al día con el Makefile.
  GOLANGCI_VERSION: "v2.15.0"
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-fhirpkg
      # parity/ es otro módulo y toma ../go-searchindex por replace.
      - uses: actions/checkout@v4
        with:
          repository: gofhir/searchindex
          token: ${{ secrets.SEARCHINDEX_TOKEN }}
          path: go-searchindex
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go-fhirpkg/go.sum
            go-fhirpkg/parity/go.sum
            go-searchindex/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: go-fhirpkg
      # El módulo parity/ no lo alcanza ./... de la raíz.
      - name: Run golangci-lint on the parity module
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: go-fhirpkg/parity

  # Vulnerabilidades alcanzables desde el código, en dependencias y en la
  # biblioteca estándar. Usa la última 1.26.x (GO_VERSION), no el 1.26.0 de
  # go.mod, que arrastra los avisos ya corregidos de la estándar.
  vuln:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-fhirpkg
      - uses: actions/checkout@v4
        with:
          repository: gofhir/searchindex
          token: ${{ secrets.SEARCHINDEX_TOKEN }}
          path: go-searchindex
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-fhirpkg/go.mod
          cache-dependency-path: |
            go-fhirpkg/go.sum
            go-fhirpkg/parity/go.sum
            go-searchindex/go.sum
      - name: Caché de packages FHIR y de Synthea (SHA-256 verificado por los scripts de descarga)
        uses: actions/cache@v4
        with:
          path: |
            go-fhirpkg/.cache/packages
            go-fhirpkg/.cache/synthea
            go-searchindex/.cache/packages
          key: fhir-data-${{ hashFiles('go-fhirpkg/scripts/*.sha256', 'go-searchindex/scripts/packages.sha256', 'go-searchindex/scripts/hl7-packages.sha256') }}
      - name: make ci
        working-directory: go-fhirpkg
        run: make ci
